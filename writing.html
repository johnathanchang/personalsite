<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Johnathan Chang</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000000;
      --text: #f0ede6;
      --muted: #7a7870;
      --accent: #9CAF88;
    }
    body.light {
      --bg: #FFFFFF;
      --text: #000000;
      --muted: #555555;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Lora', serif; padding: 80px 48px; transition: background 0.2s ease; }
    .container { max-width: 680px; margin: 0 auto; }
    .back { font-size: 12px; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; display: inline-block; margin-bottom: 64px; transition: color 0.15s; }
    .back:hover { color: var(--text); }
    .label { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 48px; transition: color 0.2s ease; }
    .writing-entry { border-left: 2px solid var(--accent); padding-left: 24px; margin-bottom: 40px; }
    .writing-entry a { font-family: 'Lora', serif; font-style: italic; font-size: 22px; font-weight: 400; color: var(--text); text-decoration: none; transition: opacity 0.15s; }
    .writing-entry a:hover { opacity: 0.7; }
    .writing-entry .date { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); margin-top: 6px; }

    /* CONTACT */
    .contact-row {
      display: flex;
      gap: 32px;
      align-items: center;
      justify-content: center;
      margin-top: 96px;
    }
    .contact-row a {
      font-family: 'Lora', serif;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .contact-row a:hover { color: var(--text); }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }
    .theme-toggle:hover { color: var(--text); }
  </style>
</head>
<body class="light">
  <div class="container">
    <a href="index.html" class="back">← back</a>
    <p class="label">Writing</p>
    <div class="writing-entry">
      <a href="pre-med-to-growth.html">From Pre-Med to Growth and Product Engineering</a>
      <p class="date">June 2026</p>
    </div>

    <div class="contact-row">
      <a href="https://www.linkedin.com/in/johnathan-chang7/" target="_blank">LinkedIn</a>
      <a href="https://x.com/johnathanjp7" target="_blank">X</a>
      <a href="https://github.com/johnathanchang" target="_blank">GitHub</a>
      <a href="mailto:changj68@mcmaster.ca">Email</a>
      <button class="theme-toggle" onclick="document.body.classList.toggle('light')" aria-label="Toggle light mode">☀︎</button>
    </div>
  </div>
</body>
</html>
